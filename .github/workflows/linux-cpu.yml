name: Linux CPU course

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/linux-*.txt
      - name: Install CPU-only dependencies
        run: >-
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu -r requirements/linux-vision-cpu.txt
      - name: Check the installed environment
        run: |
          python -m pip check
          python -c "import torch, torchvision; print('torch:', torch.__version__, 'torchvision:', torchvision.__version__); assert torch.version.cuda is None and torch.version.hip is None, 'Expected a CPU-only PyTorch build'"
      - name: Run all offline lesson paths
        run: python scripts/check_course.py
      - name: Check foundational contracts
        run: python -m unittest discover -s tests
      - name: Check image and transfer contracts
        run: python -m lessons.33-transfer-inference.check_contracts
      - name: Check attention and capstone contracts
        run: python -m unittest lessons.54-capstone-inference.test_contracts
